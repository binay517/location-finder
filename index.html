<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .map-container {
            height: 400px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Location Finder</h1>
        <p>View locations, find your phone, and manage data.</p>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        Map
                    </div>
                    <div class="card-body">
                        <div id="map" class="map-container"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        Manage Locations
                    </div>
                    <div class="card-body">
                        <form id="locationForm">
                            <div class="mb-3">
                                <label for="name" class="form-label">Location Name</label>
                                <input type="text" id="name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="latitude" class="form-label">Latitude</label>
                                <input type="number" step="any" id="latitude" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="longitude" class="form-label">Longitude</label>
                                <input type="number" step="any" id="longitude" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Add Location</button>
                        </form>

                        <hr>

                        <h5>Saved Locations</h5>
                        <ul id="locationList" class="list-group">
                            <!-- Locations will be added here dynamically -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let markers = [];

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 37.7749, lng: -122.4194 }, // Default to San Francisco
                zoom: 10
            });
        }

        function addMarker(name, lat, lng) {
            const marker = new google.maps.Marker({
                position: { lat, lng },
                map,
                title: name
            });
            markers.push(marker);
        }

        document.getElementById('locationForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const latitude = parseFloat(document.getElementById('latitude').value);
            const longitude = parseFloat(document.getElementById('longitude').value);

            addMarker(name, latitude, longitude);

            const listItem = document.createElement('li');
            listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
            listItem.innerHTML = `
                <span>${name} (${latitude}, ${longitude})</span>
                <button class="btn btn-danger btn-sm delete-btn">Delete</button>
            `;

            document.getElementById('locationList').appendChild(listItem);

            listItem.querySelector('.delete-btn').addEventListener('click', function () {
                listItem.remove();
                const markerIndex = markers.findIndex(marker => marker.title === name);
                if (markerIndex > -1) {
                    markers[markerIndex].setMap(null);
                    markers.splice(markerIndex, 1);
                }
            });

            document.getElementById('locationForm').reset();
        });
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</body>
</html>
